[package]
name = "videos"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
deadpool-sqlite = "0.14.0"
dotenvy = "0.15.7"
futures = "0.3.34"
include_dir = "0.7.4"
leptos = { version = "0.8.22", features = ["ssr"] }
object_store = "0.14.2"
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
reqwest = { version = "0.13.5", features = ["query"] }
rusqlite = { version = "0.40.0", features = ["bundled", "uuid"] }
rusqlite_migration = { version = "2.3.0", features = ["from-directory"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
